# <项目名>.conf —— 统一网关站点配置片段
# 依据：内网 B/S 架构开发规范 v2.7 §4.2
#
# 交付流程：
#   1) 开发方：本文件随交付包提供。把示例名整体替换掉：
#        myapp-app   → <项目名>-app    （容器名，与 compose 的 container_name 一致）
#        myapp.lan   → 与 .env 的 SITE_DOMAIN 逐字一致（运维分配的域名，如 xz.sjq.sh）
#   2) 运维：放入宿主 /home/docker/nginx/conf.d/ 后执行
#        sudo docker exec nginx-gateway nginx -t
#        sudo docker exec nginx-gateway nginx -s reload
#
# 本文件在 nginx-gateway 容器内生效；容器已接入 gateway-network，
# 因此可直接以容器名访问项目容器（规范 §3.3：容器名固定 <项目名>-app）。
#
# ---------- 为什么不用 upstream 块（多项目共存下的关键设计）----------
# nginx 在【解析配置时】解析 upstream 里的主机名并长期缓存，会带来两个致命问题：
#   ① 项目容器没起来 / 已下线但 conf 还在 → nginx -t 与 reload 失败，
#      【全站所有项目】的入口一起挂掉（VM 重启时顺序不对也会触发）；
#   ② 升级重建容器后 IP 变化 → 网关仍指向旧 IP，该项目 502，直到有人 reload。
#
# 改用 resolver + 变量 proxy_pass 后，解析被推迟到【请求时】并按 valid 自动刷新：
#   单个项目异常只影响它自己，网关永远能起来。
#
# 代价：不再使用 upstream 组，因此失去 keepalive 与 max_fails 被动健康检查
#      （几十人的内网场景可忽略；换来的是全站不会被单个项目拖死）。

server {
    listen 80;
    server_name myapp.lan;          # 【强制】必须与 .env 的 SITE_DOMAIN 逐字一致（见 §4.2）

    # 安全响应头（内网同样适用）：不暴露版本号、禁 MIME 嗅探、禁被外站套壳。
    # 注意：nginx 的 add_header 只要在某个 location 里出现，server 块的这几条就不再继承——
    #       后续若给某个 location 单独加 add_header，记得把这四条一并复制过去。
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 未启用 CSP：组件库（Element Plus / Ant Design 等）会在运行期注入内联样式，
    # 严格 CSP 会导致白屏且现场难以排查；如要启用，请按实际产物放宽 style-src 后再上。

    # Docker 内置 DNS（容器在自定义网络上时固定为 127.0.0.11）。
    # valid=10s 表示解析结果缓存 10s，容器重建后的 IP 变化会在 10s 内自动跟随。
    # ipv6=off 避免解析出 IPv6 地址后连不上。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 变量形式：nginx 会在请求时通过上面的 resolver 解析，而不是启动时
    set $app_backend myapp-app:80;

    # 上传大小上限，按项目实际需求调整（需与后端限制一致，见规范 §3.5）
    client_max_body_size 200m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_pass http://$app_backend;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;   # 导出/下载等长耗时操作
        proxy_read_timeout    300s;

        # 大文件导出/下载建议关闭缓冲，避免长时间占内存
        # proxy_buffering off;
    }
}
