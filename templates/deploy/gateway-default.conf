# gateway-default.conf —— 兜底站点，防止多项目串站
# 依据：内网 B/S 架构开发规范 v2.2 §4.3
#
# 背景（实测风险，2026-09-29 复现）：
#   当 conf.d 中只有一个 server 块时，nginx 会把它当作默认站点，
#   于是任意 Host（甚至不带 Host）都能访问到该项目。
#   多项目上线后，访问 A 项目域名可能落到 B 项目页面 —— 即串站。
#
# 交付：由运维放入宿主 /home/docker/nginx/conf.d/
#       文件名建议加 00- 前缀，确保被最先加载：
#         sudo cp gateway-default.conf /home/docker/nginx/conf.d/00-default.conf
#         sudo docker exec nginx-gateway nginx -t
#         sudo docker exec nginx-gateway nginx -s reload

server {
    # IPv4 与 IPv6 都要声明 default_server，
    # 否则 IPv6 请求仍可能落到 conf.d 中第一个业务站点
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # 444：不返回任何响应，直接断开连接（比返回默认页更干净）
    return 444;
}
